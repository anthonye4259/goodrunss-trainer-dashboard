    <!-- G - Left curved chain link -->
    <path d="M 0 20
             C 0 5, 10 0, 30 0
             L 60 0
             C 75 0, 80 8, 80 20
             L 80 22
             L 40 22
             L 40 35
             L 80 35
             L 80 40
             C 80 55, 70 60, 50 60
             L 20 60
             C 5 60, 0 50, 0 40
             L 0 20
             Z
             M 20 22
             C 15 22, 13 25, 13 30
             L 13 40
             C 13 48, 18 50, 25 50
             L 50 50
             C 58 50, 67 48, 67 40
             L 67 35
             L 40 35
             L 40 22
             L 20 22
             Z"
