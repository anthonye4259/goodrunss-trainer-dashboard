    <!-- Connecting piece between G and R -->
    <rect x="67" y="28" width="28" height="20" rx="4" fill="#000000"/>
    
    <!-- R - Right chain link with extending leg -->
    <path d="M 95 35
             L 125 35
             C 138 35, 145 42, 145 52
             C 145 62, 138 69, 125 69
             L 123 69
             L 155 105
             L 135 105
             L 108 73
             L 108 69
             L 95 69
             L 95 35
             Z
             M 108 47
             L 108 57
             L 125 57
             C 130 57, 133 55, 133 52
             C 133 49, 130 47, 125 47
             L 108 47
             Z"
          fill="#000000"/>
  </g>
  
  <!-- GOODRUNSS Text -->
  <text x="200" y="310" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="38" 
        font-weight="700" 
        text-anchor="middle" 
        letter-spacing="3"
        fill="#000000">GOODRUNSS</text>
</svg>
