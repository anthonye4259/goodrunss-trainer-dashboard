<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- GoodRunss Logo - GR Chain Link Design -->
  <g transform="translate(50, 80)">
    <!-- Left part of G -->
    <path d="M 40 60 Q 20 60 20 80 L 20 140 Q 20 160 40 160 L 100 160 Q 120 160 120 140 L 120 120 L 80 120 L 80 100 L 120 100" 
          fill="black" 
          stroke="black" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Right part connecting to R -->
    <path d="M 140 100 L 180 100 Q 200 100 200 80 L 200 60 L 260 60 Q 280 60 280 80 L 280 100 L 240 100 L 240 140 Q 240 160 260 160 L 280 160 L 300 140" 
          fill="black" 
          stroke="black" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection piece -->
    <rect x="110" y="90" width="40" height="20" fill="black" rx="5"/>
  </g>
  
  <!-- GOODRUNSS Text -->
  <text x="200" y="280" 
        font-family="Arial, sans-serif" 
        font-size="42" 
        font-weight="bold" 
        text-anchor="middle" 
        letter-spacing="2"
        fill="black">GOODRUNSS</text>
</svg>

