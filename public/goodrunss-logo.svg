<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- GoodRunss Chain Link Logo -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3f030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd22e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- G - Left curved chain link -->
  <path d="M 80 120 
           C 80 90, 100 70, 130 70
           L 190 70
           C 210 70, 220 85, 220 100
           C 220 100, 220 105, 220 105
           L 150 105
           L 150 135
           L 220 135
           L 220 140
           C 220 170, 200 190, 170 190
           L 110 190
           C 80 190, 60 170, 60 140
           L 60 120
           Z
           M 110 105
           C 100 105, 95 110, 95 120
           L 95 140
           C 95 155, 105 165, 120 165
           L 170 165
           C 185 165, 195 155, 195 140
           L 195 135
           L 150 135
           L 150 105
           L 110 105
           Z"
        fill="url(#logoGradient)" 
        stroke="none"/>
  
  <!-- R - Right chain link with extending leg -->
  <path d="M 230 135
           L 290 135
           C 310 135, 320 145, 320 165
           C 320 185, 310 195, 290 195
           L 285 195
           L 340 250
           L 305 250
           L 255 200
           L 255 195
           L 230 195
           L 230 135
           Z
           M 255 160
           L 255 170
           L 290 170
           C 298 170, 303 168, 303 165
           C 303 162, 298 160, 290 160
           L 255 160
           Z"
        fill="url(#logoGradient)" 
        stroke="none"/>
  
  <!-- Connecting piece between G and R -->
  <rect x="195" y="130" width="35" height="30" rx="5" fill="url(#logoGradient)"/>
  
  <!-- GOODRUNSS Text -->
  <text x="200" y="310" 
        font-family="Arial, sans-serif, -apple-system, BlinkMacSystemFont" 
        font-size="36" 
        font-weight="800" 
        text-anchor="middle" 
        letter-spacing="3"
        fill="url(#logoGradient)">GOODRUNSS</text>
</svg>
